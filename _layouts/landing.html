<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ site.title | default: page.title }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | strip }}">
  <style>
    /* Shared design language of the binoio.github.io product pages:
       system font, #1d1d1f/#86868b text, hairline borders, 12px radii. */
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --secondary: #86868b;
      --border: #d2d2d7;
      --card-bg: #f5f5f7;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0f;
        --fg: #f5f5f7;
        --secondary: #a0a0a5;
        --border: #2a2a30;
        --card-bg: #16161c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    .hero { text-align: center; padding: 72px 0 40px; }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    .hero p { font-size: clamp(1.05rem, 2.5vw, 1.35rem); color: var(--secondary); margin: 0; }
    /* One dot per app, in its accent — the family, at a glance. */
    .family-dots { display: flex; justify-content: center; gap: 9px; margin-top: 26px; }
    .family-dots span { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      padding: 24px 0 56px;
    }
    .card {
      --accent: #007aff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--fg);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 28px -12px color-mix(in srgb, var(--accent) 55%, transparent);
      outline: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card:hover { transition: none; transform: none; }
    }
    .card .mark {
      width: 56px; height: 56px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; font-weight: 700;
      background: var(--accent); color: #fff;
      overflow: hidden;
    }
    .card .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card h2 { font-size: 1.1rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
    .card p { font-size: .92rem; line-height: 1.45; color: var(--secondary); margin: 0; flex: 1; }
    .card .go { font-size: .9rem; font-weight: 600; color: var(--accent); }
    .card .go::after { content: " →"; transition: margin-left .18s ease; }
    .card:hover .go::after { margin-left: 4px; }

    /* Per-product identity, echoing each landing page. */
    .card.donots      { background: #faf8f5; }
    .card.note-enough { background: #fffbf0; }
    .card.edith .mark { background: #E6E6FA; color: #2D3748; }
    /* Kona's landing page is dark-roast themed; its card matches in both modes. */
    .card.kona { background: #1a1a2e; border-color: #2a2a3e; color: #f5f5f7; }
    .card.kona p { color: #a0a0a5; }
    @media (prefers-color-scheme: dark) {
      .card.donots      { background: #1c1813; }
      .card.note-enough { background: #1f1a10; }
    }

    footer { text-align: center; color: var(--secondary); font-size: .85rem; padding: 28px 0 36px; }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
  <footer>&copy; 2026 Michael Bino</footer>
</body>
</html>
